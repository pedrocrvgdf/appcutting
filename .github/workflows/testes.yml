name: Testes

# Roda a cada envio para a main e em todo pull request.
# O objetivo é simples: nada quebrado chega ao celular de ninguém.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Extrair o JavaScript embutido no index.html
        run: node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");const m=h.match(/<script type="module">([\s\S]*?)<\/script>/);if(!m){console.error("Bloco <script type=module> nao encontrado no index.html");process.exit(1)}fs.writeFileSync("/tmp/app.mjs",m[1]);console.log("Extraido:",m[1].length,"caracteres")'

      - name: Conferir a sintaxe
        run: node --check --input-type=module < /tmp/app.mjs

      # Toda alteracao no index.html exige subir a versao do cache em sw.js,
      # senao a correcao nao chega aos usuarios. Aqui vira aviso, nao bloqueio.
      - name: Conferir a versao do cache do service worker
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --quiet FETCH_HEAD -- index.html; then
            echo "index.html nao mudou — nada a conferir."
          elif git diff FETCH_HEAD -- sw.js | grep -q '^+const CACHE'; then
            echo "Versao do cache incrementada: OK"
          else
            echo "::warning file=sw.js::index.html mudou mas a versao do cache em sw.js nao subiu. Sem isso a atualizacao nao chega aos usuarios."
          fi

      - name: Rodar os testes
        run: npm test

      - name: Guardar o relatorio
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 14
