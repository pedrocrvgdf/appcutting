<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
    a { color: #0E7C6B; } a:hover { color: #0A5D50; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FFF6E5; overflow: hidden; display: flex; flex-direction: column; color: #14201C">

  <div style="background: #0E7C6B; border-bottom: 4px solid #14201C; padding: 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <div>
      <div style="font-family: 'Baloo 2'; font-size: 25px; font-weight: 800; color: #FFFFFF; line-height: 1.1">Treino A</div>
      <div style="font-size: 11px; font-weight: 900; letter-spacing: .1em; color: #A5E8D9">EXERCÍCIO 1 DE 2</div>
    </div>
    <div style="background: #FFC93C; border: 3px solid #14201C; border-radius: 14px; padding: 8px 13px; box-shadow: 3px 3px 0 #14201C">
      <div style="font-family: 'Baloo 2'; font-size: 22px; font-weight: 800; line-height: 1">18:42</div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 16px 18px 0; display: flex; flex-direction: column; gap: 12px">

    <div>
      <div style="font-family: 'Baloo 2'; font-size: 29px; font-weight: 800; line-height: 1.1">Supino reto</div>
      <div style="font-size: 13px; font-weight: 800; color: #6B7B74; margin-top: 2px">3 séries · descanso 01:30 · falha entre 6–12 reps</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">

      <div style="background: #FFFFFF; border: 3px solid #14201C; border-radius: 18px; box-shadow: 4px 4px 0 #14201C; padding: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #7ED6A5; border: 3px solid #14201C; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2'; font-size: 17px; font-weight: 800">1</div>
          <div style="flex-grow: 1; display: flex; gap: 8px">
            <div style="flex-grow: 1; height: 48px; background: #F2FBF7; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px">
              <span style="font-family: 'Baloo 2'; font-size: 20px; font-weight: 800">60</span>
              <span style="font-size: 11px; font-weight: 900; color: #6B7B74">KG</span>
            </div>
            <div style="flex-grow: 1; height: 48px; background: #F2FBF7; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px">
              <span style="font-family: 'Baloo 2'; font-size: 20px; font-weight: 800">10</span>
              <span style="font-size: 11px; font-weight: 900; color: #6B7B74">REPS</span>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px">
          <span style="font-size: 11px; font-weight: 900; color: #6B7B74; width: 32px">RIR</span>
          <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px">
            <div style="height: 44px; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; background: #FFFFFF">0</div>
            <div style="height: 44px; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; background: #0E7C6B; color: #FFFFFF; box-shadow: 3px 3px 0 #14201C">1</div>
            <div style="height: 44px; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; background: #FFFFFF">2</div>
            <div style="height: 44px; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; background: #FFFFFF">3+</div>
          </div>
        </div>
        <div style="margin-top: 9px; font-size: 11px; font-weight: 800; color: #8A9691">anterior: 57,5 kg × 10 · RIR 1</div>
      </div>

      <div style="background: #FFFFFF; border: 3px solid #14201C; border-radius: 18px; box-shadow: 4px 4px 0 #14201C; padding: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #FFC93C; border: 3px solid #14201C; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2'; font-size: 17px; font-weight: 800">2</div>
          <div style="flex-grow: 1; display: flex; gap: 8px">
            <div style="flex-grow: 1; height: 48px; background: #FFFDF6; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px">
              <span style="font-family: 'Baloo 2'; font-size: 20px; font-weight: 800; color: #B9C4BF">60</span>
              <span style="font-size: 11px; font-weight: 900; color: #6B7B74">KG</span>
            </div>
            <div style="flex-grow: 1; height: 48px; background: #FFFDF6; border: 3px solid #14201C; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px">
              <span style="font-family: 'Baloo 2'; font-size: 20px; font-weight: 800; color: #B9C4BF">10</span>
              <span style="font-size: 11px; font-weight: 900; color: #6B7B74">REPS</span>
            </div>
          </div>
        </div>
        <div style="margin-top: 9px; font-size: 11px; font-weight: 800; color: #8A9691">anterior: 57,5 kg × 9 · RIR 1</div>
      </div>

      <div style="background: #FFFFFF; border: 3px solid #14201C; border-radius: 18px; box-shadow: 4px 4px 0 #14201C; padding: 12px; opacity: .55">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #EDE4D2; border: 3px solid #14201C; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2'; font-size: 17px; font-weight: 800">3</div>
          <div style="flex-grow: 1; font-size: 13px; font-weight: 800; color: #6B7B74">última série</div>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 18px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 62px; background: #FF7A59; border: 4px solid #14201C; border-radius: 18px; box-shadow: 5px 5px 0 #14201C; display: flex; align-items: center; justify-content: center; gap: 9px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
      <span style="font-family: 'Baloo 2'; font-size: 21px; font-weight: 800; color: #FFFFFF">Descansar 01:30</span>
    </div>
    <div style="height: 52px; background: #0E7C6B; border: 3px solid #14201C; border-radius: 16px; box-shadow: 4px 4px 0 #14201C; display: flex; align-items: center; justify-content: center">
      <span style="font-size: 16px; font-weight: 900; color: #FFFFFF">Próximo exercício →</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
