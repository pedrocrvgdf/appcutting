<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #2FF3C8; } a:hover { color: #7BFFDF; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B100E; overflow: hidden; display: flex; flex-direction: column; color: #ECFDF7; position: relative">

  <div style="flex-shrink: 0; position: relative; overflow: hidden; padding: 22px 20px 18px; background: linear-gradient(150deg, #123B32 0%, #0B100E 78%)">
    <div style="position: absolute; top: -50px; right: -80px; width: 240px; height: 200px; background: linear-gradient(135deg, rgba(47,243,200,.22), rgba(47,243,200,0)); transform: rotate(-16deg); border-radius: 34px"></div>
    <div style="position: relative; display: flex; align-items: flex-start; justify-content: space-between">
      <div>
        <div style="font-size: 11px; font-weight: 800; letter-spacing: .16em; color: #2FF3C8">TREINO A · 1 DE 2</div>
        <div style="font-size: 32px; font-weight: 900; line-height: 1.03; letter-spacing: -.03em; margin-top: 4px">SUPINO<br>RETO</div>
      </div>
      <div style="text-align: right">
        <div style="font-size: 30px; font-weight: 900; letter-spacing: -.03em; line-height: 1">18:42</div>
        <div style="font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #7E918A; margin-top: 2px">EM TREINO</div>
      </div>
    </div>
    <div style="position: relative; display: flex; gap: 5px; margin-top: 18px">
      <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #2FF3C8"></div>
      <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #2FF3C8"></div>
      <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #21332C"></div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">

    <div style="background: #101815; border: 1px solid #2FF3C8; border-radius: 24px; padding: 18px; box-shadow: 0 0 0 4px rgba(47,243,200,.07)">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #2FF3C8">SÉRIE 3 DE 3</span>
        <span style="font-size: 11px; font-weight: 700; color: #556B63">anterior 57,5 × 9</span>
      </div>
      <div style="display: flex; gap: 11px">
        <div style="flex-grow: 1; background: #16211D; border-radius: 18px; padding: 13px 15px">
          <div style="font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #7E918A">CARGA</div>
          <div style="display: flex; align-items: baseline; gap: 4px">
            <span style="font-size: 34px; font-weight: 900; letter-spacing: -.04em; line-height: 1.1">60</span>
            <span style="font-size: 13px; font-weight: 700; color: #7E918A">kg</span>
          </div>
        </div>
        <div style="flex-grow: 1; background: #16211D; border-radius: 18px; padding: 13px 15px">
          <div style="font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #7E918A">REPS</div>
          <div style="display: flex; align-items: baseline; gap: 4px">
            <span style="font-size: 34px; font-weight: 900; letter-spacing: -.04em; line-height: 1.1">10</span>
            <span style="font-size: 13px; font-weight: 700; color: #7E918A">×</span>
          </div>
        </div>
      </div>
      <div style="margin-top: 15px">
        <div style="font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #7E918A; margin-bottom: 8px">RIR — QUANTAS AINDA AGUENTAVA</div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <div style="height: 48px; border-radius: 14px; background: #16211D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #7E918A">0</div>
          <div style="height: 48px; border-radius: 14px; background: linear-gradient(150deg, #2FF3C8, #12B394); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #062018">1</div>
          <div style="height: 48px; border-radius: 14px; background: #16211D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #7E918A">2</div>
          <div style="height: 48px; border-radius: 14px; background: #16211D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #7E918A">3+</div>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; background: #101815; border: 1px solid #23342E; border-radius: 18px; padding: 12px 14px">
        <div style="font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #556B63">SÉRIE 1</div>
        <div style="font-size: 16px; font-weight: 800; margin-top: 2px; letter-spacing: -.01em">60 × 10</div>
      </div>
      <div style="flex-grow: 1; background: #101815; border: 1px solid #23342E; border-radius: 18px; padding: 12px 14px">
        <div style="font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #556B63">SÉRIE 2</div>
        <div style="font-size: 16px; font-weight: 800; margin-top: 2px; letter-spacing: -.01em">60 × 9</div>
      </div>
    </div>

    <div style="border: 1px solid #3C4A1E; background: rgba(200,255,77,.07); border-radius: 18px; padding: 13px 15px; display: flex; align-items: center; gap: 11px">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#C8FF4D" stroke-width="2.4" stroke-linecap="round" style="flex-shrink: 0"><path d="M7 17l5-9 5 9M4 21h16"/></svg>
      <span style="font-size: 12px; font-weight: 700; color: #C8FF4D">+2,5 kg desde a última sessão deste exercício</span>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 14px 20px 22px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 66px; border-radius: 22px; background: linear-gradient(120deg, #2FF3C8, #12B394); box-shadow: 0 10px 30px rgba(47,243,200,.30); display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#062018" stroke-width="2.7" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
      <span style="font-size: 20px; font-weight: 900; color: #062018; letter-spacing: -.01em">DESCANSAR 01:30</span>
    </div>
    <div style="height: 52px; border: 1px solid #23342E; border-radius: 18px; display: flex; align-items: center; justify-content: center">
      <span style="font-size: 15px; font-weight: 800; color: #ECFDF7; letter-spacing: .02em">PRÓXIMO EXERCÍCIO →</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
